name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript typecheck
        run: npm run typecheck

  test-and-coverage:
    name: Automated Tests & Coverage Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: employee_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run database migrations
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/employee_management_test
          NODE_ENV: test
        run: npm run migrate

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/employee_management_test
          NODE_ENV: test
          PORT: 3000
        run: npm run test:coverage

  build:
    name: Production Build Verification
    needs: [lint-and-typecheck, test-and-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript to JavaScript
        run: npm run build

      - name: Verify build artifacts
        run: test -f dist/server.js

