<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management — Directory</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom Solid Design System Stylesheet -->
  <link rel="stylesheet" href="/client/style.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">
  <!-- Top Navigation Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-sm">
          EM
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">Employee Management</h1>
          <p class="text-xs font-medium text-slate-500">Directory & Team Management</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button 
          id="addEmployeeBtn" 
          data-testid="add-employee-btn" 
          class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-semibold rounded-lg shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all cursor-pointer"
        >
          <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          Add Employee
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    <!-- Controls & Filters Bar -->
    <div class="bg-white rounded-xl border border-slate-200 p-4 mb-6 shadow-sm">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
        <!-- Search Bar -->
        <div class="md:col-span-6 relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>
          <input 
            type="text" 
            id="searchInput" 
            data-testid="search-input" 
            placeholder="Search employees by name, role, email..." 
            class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all bg-white"
          />
        </div>

        <!-- Team Filter Dropdown -->
        <div class="md:col-span-4">
          <select 
            id="teamFilter" 
            data-testid="team-filter" 
            class="w-full py-2 pl-3 pr-8 border border-slate-300 rounded-lg text-sm text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white"
          >
            <option value="">All Teams (Filter)</option>
          </select>
        </div>

        <!-- View Mode Toggle -->
        <div class="md:col-span-2 flex justify-end space-x-2">
          <button 
            id="viewGridBtn" 
            data-testid="view-toggle-grid" 
            title="Grid View" 
            class="px-3 py-2 border border-slate-200 rounded-lg bg-indigo-50 text-indigo-700 font-semibold text-xs flex items-center space-x-1.5 transition-colors cursor-pointer"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
            </svg>
            <span>Grid</span>
          </button>
          <button 
            id="viewTableBtn" 
            data-testid="view-toggle-table" 
            title="Table View" 
            class="px-3 py-2 border border-slate-200 rounded-lg bg-white text-slate-600 font-semibold text-xs flex items-center space-x-1.5 hover:bg-slate-50 transition-colors cursor-pointer"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
            </svg>
            <span>Table</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Status / Notification Alert Banner -->
    <div id="statusBanner" class="hidden mb-6 p-4 rounded-xl text-sm font-medium transition-all shadow-sm"></div>

    <!-- Directory Content Container -->
    <div id="directoryContainer" class="min-h-[350px]">
      <!-- Cards View (Default) -->
      <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <!-- Table View (Hidden by default) -->
      <div id="tableView" class="hidden bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead class="bg-slate-50 text-slate-600 font-semibold uppercase tracking-wider text-xs">
              <tr>
                <th class="px-6 py-3.5 text-left">Employee</th>
                <th class="px-6 py-3.5 text-left">Role / Position</th>
                <th class="px-6 py-3.5 text-left">Age</th>
                <th class="px-6 py-3.5 text-left">Teams</th>
                <th class="px-6 py-3.5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-200 bg-white"></tbody>
          </table>
        </div>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-20 bg-white rounded-xl border-2 border-dashed border-slate-200">
        <svg class="w-12 h-12 mx-auto text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
        </svg>
        <h3 class="text-base font-semibold text-slate-800 mb-1">No employees found</h3>
        <p class="text-sm text-slate-500 max-w-sm mx-auto">Try adjusting your search query or team filter, or add a new employee profile.</p>
      </div>
    </div>

    <!-- Pagination Controls -->
    <div id="paginationControls" class="mt-8 flex items-center justify-between border-t border-slate-200 pt-4 hidden">
      <span id="pageInfo" class="text-sm font-medium text-slate-600">Showing page 1 of 1</span>
      <div class="flex space-x-2">
        <button id="prevPageBtn" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm font-medium hover:bg-slate-50 disabled:opacity-40 transition-colors">Previous</button>
        <button id="nextPageBtn" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm font-medium hover:bg-slate-50 disabled:opacity-40 transition-colors">Next</button>
      </div>
    </div>
  </main>

  <!-- Add / Edit Employee Modal Dialog -->
  <div id="employeeModal" data-testid="employee-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-none flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-lg w-full overflow-hidden transform transition-all">
      <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <h3 id="modalTitle" class="text-base font-bold text-slate-900">Add New Employee</h3>
        <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 text-2xl font-bold leading-none p-1">&times;</button>
      </div>
      <form id="employeeForm" data-testid="employee-form" class="p-6 space-y-4">
        <input type="hidden" id="employeeId" value="">
        
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Full Name *</label>
          <input 
            type="text" 
            id="formFullName" 
            data-testid="input-fullname" 
            placeholder="e.g. Alex Mercer" 
            required 
            minlength="2" 
            maxlength="150" 
            class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Address *</label>
          <input 
            type="email" 
            id="formEmail" 
            data-testid="input-email" 
            placeholder="alex.mercer@company.com" 
            required 
            class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
          />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Role / Position *</label>
            <input 
              type="text" 
              id="formRole" 
              data-testid="input-role" 
              placeholder="e.g. Senior Engineer" 
              required 
              minlength="2" 
              maxlength="100" 
              class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Birth Date (Age 18–120)</label>
            <input 
              type="date" 
              id="formBirthDate" 
              data-testid="input-birthdate" 
              class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Avatar Image (Optional)</label>
          <input 
            type="file" 
            id="formAvatarFile" 
            accept="image/*" 
            class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"
          />
          <input type="hidden" id="formAvatarUrl" value="">
        </div>

        <div class="pt-4 border-t border-slate-200 flex justify-end space-x-3">
          <button 
            type="button" 
            id="cancelModalBtn" 
            data-testid="cancel-employee-btn" 
            class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors"
          >
            Cancel
          </button>
          <button 
            type="submit" 
            id="saveEmployeeBtn" 
            data-testid="save-employee-btn" 
            class="px-5 py-2 border border-transparent rounded-lg text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm transition-colors"
          >
            Save Employee
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/client/app.js"></script>
</body>
</html>
